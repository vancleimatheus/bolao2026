<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão ENADE · Componente Específico de Pedagogia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap');

  :root{
    --ink:#20223A;
    --indigo:#2A3559;
    --indigo-deep:#1D2440;
    --ivory:#F0EDE3;
    --cream:#FBF9F3;
    --gold:#C08A28;
    --gold-soft:#EFDDB0;
    --certo:#3F6B4F;
    --certo-bg:#E7F0E9;
    --errado:#A6433D;
    --errado-bg:#F6E6E4;
    --line:#D9D6C9;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .topo{
    background:var(--indigo-deep);
    color:var(--cream);
    padding:28px 24px 22px;
    text-align:center;
  }

  .topo .kicker{
    font-family:'Fraunces', serif;
    font-size:14px;
    letter-spacing:.04em;
    color:var(--gold-soft);
    margin:0 0 4px;
  }

  .topo h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(22px, 4vw, 32px);
    margin:0 0 6px;
  }

  .topo p{
    margin:0 auto;
    font-size:14.5px;
    color:#D3D6E6;
    max-width:540px;
  }

  .trilha{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    padding:16px 24px 0;
    max-width:760px;
    margin:0 auto;
  }

  .marca{
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ivory);
    color:var(--indigo);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .marca.certa{ background:var(--certo); border-color:var(--certo); color:#fff; }
  .marca.errada{ background:var(--errado); border-color:var(--errado); color:#fff; }
  .marca.atual{ box-shadow:0 0 0 3px var(--gold-soft); }

  main{
    max-width:760px;
    margin:0 auto;
    padding:28px 24px 60px;
  }

  .cartao{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:30px 30px 26px;
  }

  .cabecalho-questao{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }

  .numero{
    font-family:'Fraunces', serif;
    font-size:36px;
    font-weight:600;
    color:var(--gold);
    line-height:1;
  }

  .meta{ display:flex; flex-direction:column; gap:2px; }
  .meta .area{ font-size:12.5px; color:var(--indigo); font-weight:600; }
  .meta .tema{ font-family:'Fraunces', serif; font-size:17px; color:var(--ink); }

  .texto-base{
    background:var(--ivory);
    border-left:3px solid var(--indigo);
    border-radius:0 4px 4px 0;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .texto-base .rotulo{
    font-family:'Fraunces', serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--indigo);
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  .texto-base p{
    margin:0 0 10px;
    font-size:14.5px;
    line-height:1.6;
    color:#33344E;
  }
  .texto-base p:last-child{ margin-bottom:0; }
  .texto-base .fonte{
    font-size:12px;
    color:#8A8778;
    font-style:italic;
  }

  .enunciado{
    font-size:16px;
    line-height:1.6;
    margin:0 0 22px;
    font-weight:600;
  }

  .alternativas{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .alt{
    display:flex;
    gap:12px;
    align-items:flex-start;
    text-align:left;
    width:100%;
    padding:13px 16px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--cream);
    cursor:pointer;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }

  .alt:hover:not(:disabled){ border-color:var(--indigo); background:#fff; }

  .alt .letra{
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--indigo);
    flex-shrink:0;
    width:20px;
  }

  .alt:disabled{ cursor:default; }

  .alt.marcada-certa{ background:var(--certo-bg); border-color:var(--certo); }
  .alt.marcada-certa .letra{ color:var(--certo); }
  .alt.marcada-errada{ background:var(--errado-bg); border-color:var(--errado); }
  .alt.marcada-errada .letra{ color:var(--errado); }
  .alt.esmaecida{ opacity:.55; }

  .justificativas{
    margin-top:20px;
    display:none;
    flex-direction:column;
    gap:10px;
  }
  .justificativas.visivel{ display:flex; }

  .just{
    border-radius:4px;
    padding:12px 15px;
    font-size:14px;
    line-height:1.55;
    border-left:3px solid var(--line);
  }
  .just.certa{ background:var(--certo-bg); border-left-color:var(--certo); }
  .just.errada{ background:var(--errado-bg); border-left-color:var(--errado); }
  .just b{ font-family:'Fraunces', serif; font-weight:600; }

  .rodape-cartao{
    margin-top:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }

  .placar{ font-size:14px; color:var(--indigo); font-weight:600; }

  button.avancar{
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
    font-size:14.5px;
    background:var(--indigo);
    color:var(--cream);
    border:none;
    padding:11px 22px;
    border-radius:4px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  button.avancar.pronta{ opacity:1; pointer-events:auto; }
  button.avancar:hover{ background:var(--indigo-deep); }

  .resultado{
    text-align:center;
    padding:40px 30px;
  }
  .resultado .numero-grande{
    font-family:'Fraunces', serif;
    font-size:64px;
    font-weight:600;
    color:var(--gold);
    line-height:1;
  }
  .resultado h2{
    font-family:'Fraunces', serif;
    font-size:22px;
    margin:6px 0 4px;
  }
  .resultado p{ color:#5A5A6E; font-size:14.5px; margin:0 0 24px; }

  .resumo-lista{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:0 0 26px;
  }
  .resumo-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13.5px;
  }
  .resumo-item .marca{ margin:0; }
  .resumo-item .tema-mini{ color:var(--ink); }
  .resumo-item .num-mini{ color:#8F8C7C; font-family:'Fraunces', serif; }

  button.reiniciar{
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
    font-size:14.5px;
    background:transparent;
    color:var(--indigo);
    border:1.5px solid var(--indigo);
    padding:10px 20px;
    border-radius:4px;
    cursor:pointer;
  }
  button.reiniciar:hover{ background:var(--ivory); }

  @media (max-width:520px){
    .cartao{ padding:22px 18px 20px; }
    .cabecalho-questao{ gap:10px; }
    .numero{ font-size:28px; }
  }
</style>
</head>
<body>

<div class="topo">
  <p class="kicker">Enade 2025 · Componente Específico</p>
  <h1>Revisão para Pedagogia</h1>
  <p>15 questões do componente específico do curso, com o texto-base de cada uma e a justificativa teórica de toda alternativa — certa e errada.</p>
</div>

<div class="trilha" id="trilha"></div>

<main>
  <div class="cartao" id="cartao"></div>
</main>

<script>
const questoes = [
  {
    numero: 31,
    tema: "Fundamentos metodológicos da História nos Anos Iniciais",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Um pedagogo que atua em um museu municipal planejou uma visita guiada com estudantes dos Anos Iniciais do Ensino Fundamental, percorrendo o bairro e mostrando casas e edifícios históricos, monumentos e outros pontos importantes para o reconhecimento da história local.</p>
      <p class="fonte">Fonte: caderno de provas Enade 2025 — Pedagogia, texto para as questões de 31 a 33 (adaptado).</p>
    `,
    enunciado: "Considerando essa situação, os fundamentos da História mobilizados nesse cenário pedagógico foram:",
    alternativas: [
      { letra:"A", texto:"Lógica, paisagem e fato histórico.", correta:false,
        justificativa:"A 'lógica' não é um fundamento metodológico específico da História; a atividade descrita mobiliza antes noções de fonte e memória a partir dos próprios espaços do bairro." },
      { letra:"B", texto:"Cartografia, alfabetização e letramento.", correta:false,
        justificativa:"Cartografia é mais própria da Geografia, e alfabetização/letramento pertencem ao campo da Língua Portuguesa — nenhum desses é um fundamento metodológico específico da História." },
      { letra:"C", texto:"Fonte, memória e tempo histórico.", correta:true,
        justificativa:"É a alternativa correta. Usar prédios, monumentos e o próprio espaço do bairro como testemunhos do passado mobiliza justamente os fundamentos de fonte histórica (os vestígios materiais), memória (a lembrança coletiva do local) e tempo histórico (a percepção de permanências e mudanças)." },
      { letra:"D", texto:"Espaço, corpo e movimento.", correta:false,
        justificativa:"Espaço, corpo e movimento são fundamentos mais associados à Educação Física, não aos fundamentos metodológicos próprios do ensino de História." }
    ]
  },
  {
    numero: 35,
    tema: "Ensino de Geografia nos Anos Iniciais",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Nos Anos Iniciais do Ensino Fundamental, o ensino de Geografia introduz conceitos como localização, orientação, mapas e representações espaciais. Uma possibilidade de conduzir esse ensino é propor atividades de representação cartográfica, incentivando os estudantes a desenharem mapas de lugares conhecidos — como a rota de casa até a escola — ou mapas imaginários de lugares fantásticos.</p>
      <p class="fonte">Fonte: caderno de provas Enade 2025 — Pedagogia, questão 35 (adaptado).</p>
    `,
    enunciado: "De acordo com esse texto, o ensino de Geografia para os Anos Iniciais tem a função de:",
    alternativas: [
      { letra:"A", texto:"Utilizar linguagens cartográficas, com vistas a resolver problemas com informações geográficas e desenvolver o pensamento espacial.", correta:true,
        justificativa:"É a alternativa correta. A atividade de desenhar mapas de lugares conhecidos ou imaginários trabalha diretamente a linguagem cartográfica e o pensamento espacial, competências específicas do ensino de Geografia nos Anos Iniciais." },
      { letra:"B", texto:"Agir individual e coletivamente com respeito, autonomia e responsabilidade, com vistas à preservação do meio ambiente.", correta:false,
        justificativa:"Descreve uma competência geral da BNCC (relacionada à sustentabilidade), e não a função específica do ensino de Geografia com foco em cartografia descrita no texto." },
      { letra:"C", texto:"Desenvolver o raciocínio lógico, o espírito de investigação e a capacidade de produzir argumentos convincentes.", correta:false,
        justificativa:"Refere-se a habilidades mais associadas ao pensamento matemático e científico, e não à função cartográfica e espacial específica do ensino de Geografia descrita no texto." },
      { letra:"D", texto:"Empregar, nas interações sociais, a variedade e o estilo de linguagens cartográficas.", correta:false,
        justificativa:"Mistura de forma pouco precisa a linguagem cartográfica com interações sociais, quando o texto trata especificamente da representação espacial como ferramenta de pensamento geográfico." }
    ]
  },
  {
    numero: 38,
    tema: "Pedagogia Social em espaço não escolar",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Uma pedagoga iniciou seu trabalho em uma instituição não governamental que acolhe crianças e adolescentes em situação de vulnerabilidade física, social e emocional. Os projetos interdisciplinares dessa instituição oferecem atendimento educacional no contraturno escolar — reforço escolar, oficinas de artes e de educação física, orientações para o autoconhecimento e o bem-estar.</p>
      <p class="fonte">Fonte: caderno de provas Enade 2025 — Pedagogia, texto para as questões 38 e 39.</p>
    `,
    enunciado: "Considerando o contexto de atuação da pedagoga e, em especial, o atendimento a essas crianças e a esses adolescentes, o planejamento das atividades deve:",
    alternativas: [
      { letra:"A", texto:"Promover a melhora no desempenho escolar por meio de testes de conteúdos previstos no currículo, tendo como foco as dificuldades de aprendizagem e as questões sociais adversas.", correta:false,
        justificativa:"Centra o planejamento em testes de conteúdo e no enquadramento das dificuldades como déficits a serem medidos, contrariando a abordagem acolhedora e contextualizada que a Pedagogia Social propõe para esse público." },
      { letra:"B", texto:"Ajustá-los às expectativas de desempenho escolar, impedindo que a condição de vulnerabilidade interfira no desenvolvimento de cada um.", correta:false,
        justificativa:"Propõe ignorar o impacto real da vulnerabilidade social sobre o desenvolvimento, uma negação da realidade que compromete o planejamento pedagógico sensível ao contexto de vida dos estudantes." },
      { letra:"C", texto:"Oferecer experiências de aprendizagem considerando a realidade, o ambiente social e as condições de vida de cada um, possibilitando ampliar os conhecimentos prévios.", correta:true,
        justificativa:"É a alternativa correta. Considerar a realidade, o ambiente social e as condições de vida de cada criança e adolescente é o princípio central de um planejamento pedagógico contextualizado, coerente com a atuação em espaços de acolhimento a populações vulneráveis." },
      { letra:"D", texto:"Desenvolver as competências e as habilidades necessárias para a formação do cidadão, assumindo que questões de ordem afetiva e social pouco impactam na aquisição de conhecimentos.", correta:false,
        justificativa:"Nega o impacto das questões afetivas e sociais sobre a aprendizagem, contrariando justamente a premissa da instituição descrita, voltada ao acolhimento de crianças em situação de vulnerabilidade emocional e social." }
    ]
  },
  {
    numero: 41,
    tema: "Uso saudável de telas na infância",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Crianças e adolescentes têm direito ao uso e ao desfrute dos recursos tecnológicos para a própria aprendizagem, mas famílias e instituições precisam agir para diminuir os riscos do mau uso dessas ferramentas — efeitos negativos sobre sono, atenção, aprendizado, sistema hormonal, regulação do humor, sistema osteoarticular, audição e visão, além do risco de exposição a contatos desconhecidos.</p>
      <p class="fonte">Fonte: sbp.com.br, acesso em 16 jun. 2025 (adaptado).</p>
    `,
    enunciado: "Considerando os direitos das crianças e os riscos do uso indevido de ferramentas tecnológicas, as ações que a escola deve desenvolver para o uso saudável de telas são:",
    alternativas: [
      { letra:"A", texto:"Estimular a medicalização para tratar o tecnoestresse e contribuir para a autogestão dos estudantes no combate ao uso excessivo das telas.", correta:false,
        justificativa:"Medicalizar uma questão de hábitos e de convivência escolar transfere ao campo clínico uma responsabilidade que é, antes de tudo, pedagógica e formativa." },
      { letra:"B", texto:"Monitorar o tempo de exposição à tela no ambiente escolar e utilizar apenas materiais didáticos impressos, desconsiderando as tecnologias digitais.", correta:false,
        justificativa:"Propõe uma rejeição total das tecnologias digitais, uma resposta desproporcional que ignora seus benefícios pedagógicos e não promove o uso crítico e equilibrado que o texto-base sugere." },
      { letra:"C", texto:"Disponibilizar textos sobre educação midiática nos canais digitais da escola e identificar casos de dependência tecnológica valendo-se de aplicativos digitais.", correta:false,
        justificativa:"Restringe a ação a meios digitais (textos on-line, aplicativos), sem propor experiências alternativas de convívio social e atividade física que equilibrem o tempo de tela." },
      { letra:"D", texto:"Promover reuniões de pais para propiciar discussões sobre o uso crítico da tecnologia e organizar práticas pedagógicas que envolvam jogos e brincadeiras, atividades ao ar livre e convívio social.", correta:true,
        justificativa:"É a alternativa correta. Articula a formação das famílias com a oferta escolar de experiências alternativas (jogos, atividades ao ar livre, convívio social), promovendo um uso equilibrado das telas sem negar seus benefícios nem recorrer à medicalização." }
    ]
  },
  {
    numero: 47,
    tema: "Língua Portuguesa, BNCC e campo da vida pública",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Uma charge retrata uma criança pedindo à mãe para aprender a ler e escrever, e a mãe reagindo com deboche, como se o desejo do filho fosse uma pretensão exagerada — uma crítica irônica à desvalorização da educação em contextos de desigualdade social. Uma professora de Anos Iniciais utilizou essa charge como ponto de partida para uma aula interdisciplinar sobre desigualdades sociais no Brasil.</p>
      <p class="fonte">Fonte: AMÂNCIO. Disponível em ensino.hi7.com, acesso em 10 nov. 2025 (adaptado).</p>
    `,
    enunciado: "Na aula de Língua Portuguesa, a professora utilizou essa mesma charge com o intuito de inter-relacionar os eixos da Base Nacional Comum Curricular (BNCC) e o campo da vida pública. Para atender a essa finalidade, o procedimento metodológico deve ser:",
    alternativas: [
      { letra:"A", texto:"Comparar as ideias expressas na charge com as ideias contidas em um meme com o mesmo tema para analisar os efeitos de humor.", correta:false,
        justificativa:"Foca na análise do humor como recurso linguístico, o que dialoga mais com o campo artístico-literário do que com o campo da vida pública indicado no enunciado." },
      { letra:"B", texto:"Produzir, a partir do debate gerado pela charge, uma notícia de um fato ocorrido na escola para ser publicada no mural.", correta:true,
        justificativa:"É a alternativa correta. Produzir uma notícia — gênero textual típico do campo jornalístico/midiático da vida pública — a partir do debate sobre desigualdade social articula exatamente os eixos da BNCC ao campo da vida pública exigido pela questão." },
      { letra:"C", texto:"Buscar, a partir dos termos contidos na charge, o significado das palavras desconhecidas para ampliar o vocabulário.", correta:false,
        justificativa:"Trata-se de uma atividade de ampliação vocabular, relevante em si, mas que não corresponde ao trabalho com gêneros do campo da vida pública solicitado pela questão." },
      { letra:"D", texto:"Transformar a charge em um poema para explorar rimas, sons, jogos de palavras e imagens.", correta:false,
        justificativa:"Trabalha com o campo artístico-literário (poema, rimas, sonoridade), e não com o campo da vida pública, que é o eixo indicado no enunciado." }
    ]
  },
  {
    numero: 50,
    tema: "Atendimento Educacional Especializado (AEE) e TEA",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Uma professora dos Anos Iniciais identificou, em um estudante com Transtorno do Espectro Autista (TEA), dificuldades relativas a habilidades motoras, verbalização, autonomia e socialização — essenciais às práticas pedagógicas de sala de aula. Reconhecendo a necessidade de suporte pedagógico e de recursos específicos, é imprescindível que o estudante receba Atendimento Educacional Especializado (AEE) para complementar a ação da professora.</p>
      <p class="fonte">Fonte: caderno de provas Enade 2025 — Pedagogia, texto para as questões 49 e 50.</p>
    `,
    enunciado: "Nesse caso, o Atendimento Educacional Especializado deve proporcionar o(a):",
    alternativas: [
      { letra:"A", texto:"Presença do estudante em algumas atividades da escola.", correta:false,
        justificativa:"É vago e sugere participação parcial, quando o AEE tem organização própria (na sala de recursos multifuncionais), e não uma presença fragmentada em 'algumas atividades'." },
      { letra:"B", texto:"Frequência em sala de recursos multifuncionais.", correta:true,
        justificativa:"É a alternativa correta. O AEE se realiza, prioritariamente, em salas de recursos multifuncionais na própria escola regular, complementando — e não substituindo — a escolarização do estudante na turma comum." },
      { letra:"C", texto:"Ingresso em classe especial na escola regular.", correta:false,
        justificativa:"A organização em 'classe especial' segregada contraria o princípio da educação inclusiva, que prevê a permanência do estudante na turma comum com o suporte complementar do AEE." },
      { letra:"D", texto:"Matrícula em escola especial no contraturno.", correta:false,
        justificativa:"Descola o AEE da escola regular, contrariando a política de inclusão vigente, que situa esse atendimento como complementar e realizado preferencialmente na própria rede regular de ensino." }
    ]
  },
  {
    numero: 51,
    tema: "Adaptações no AEE para deficiência motora",
    textoBase: `
      <p class="rotulo">Texto-base</p>
      <p>Uma estudante do 4º ano do Ensino Fundamental tem deficiência motora que limita os movimentos e a coordenação dos membros e da cabeça. Além da acessibilidade física e pedagógica, ela tem direito ao Atendimento Educacional Especializado (AEE), conforme a Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva e a Lei nº 13.146/15, podendo utilizar tecnologias assistivas e recursos de comunicação alternativa que favoreçam o acesso ao currículo e o desenvolvimento de sua autonomia.</p>
      <p class="fonte">Fonte: caderno de provas Enade 2025 — Pedagogia, questão 51.</p>
    `,
    enunciado: "No que diz respeito aos processos de alfabetização e de letramento dessa estudante, os instrumentos de adaptação que devem ser utilizados no AEE são os(as):",
    alternativas: [

let atual = 0;
let respostas = new Array(questoes.length).fill(null);
let respostasEscolhidas = new Array(questoes.length).fill(null);

const trilhaEl = document.getElementById('trilha');
const cartaoEl = document.getElementById('cartao');

function montarTrilha(){
  trilhaEl.innerHTML = '';
  questoes.forEach((q, i) => {
    const m = document.createElement('div');
    m.className = 'marca';
    m.textContent = i + 1;
    if (i === atual) m.classList.add('atual');
    if (respostas[i] !== null) {
      m.classList.add(respostas[i] ? 'certa' : 'errada');
    }
    trilhaEl.appendChild(m);
  });
}

function renderizarQuestao(){
  if (atual >= questoes.length) { renderizarResultado(); return; }
  const q = questoes[atual];
  const jaRespondida = respostas[atual] !== null;

  let html = `
    <div class="cabecalho-questao">
      <div class="numero">${String(q.numero).padStart(2,'0')}</div>
      <div class="meta">
        <span class="area">Componente Específico — Pedagogia</span>
        <span class="tema">${q.tema}</span>
      </div>
    </div>
    <div class="texto-base">${q.textoBase}</div>
    <p class="enunciado">${q.enunciado}</p>
    <div class="alternativas">
  `;

  q.alternativas.forEach((alt, idx) => {
    let classe = '';
    if (jaRespondida) {
      if (alt.correta) classe = 'marcada-certa';
      else if (!alt.correta && respostasEscolhidas[atual] === idx) classe = 'marcada-errada';
      else classe = 'esmaecida';
    }
    html += `<button class="alt ${classe}" ${jaRespondida ? 'disabled' : ''} data-idx="${idx}">
      <span class="letra">${alt.letra}</span><span>${alt.texto}</span>
    </button>`;
  });

  html += `</div><div class="justificativas ${jaRespondida ? 'visivel' : ''}" id="justs">`;
  if (jaRespondida) {
    q.alternativas.forEach(alt => {
      html += `<div class="just ${alt.correta ? 'certa' : 'errada'}">
        <b>${alt.letra}${alt.correta ? ' — correta.' : ' — incorreta.'}</b> ${alt.justificativa}
      </div>`;
    });
  }
  html += `</div>
    <div class="rodape-cartao">
      <span class="placar">Acertos: ${respostas.filter(r => r === true).length} / ${respostas.filter(r => r !== null).length}</span>
      <button class="avancar ${jaRespondida ? 'pronta' : ''}" id="btnAvancar">
        ${atual === questoes.length - 1 ? 'Ver resultado' : 'Próxima questão'}
      </button>
    </div>
  `;

  cartaoEl.innerHTML = html;
  montarTrilha();

  if (!jaRespondida) {
    cartaoEl.querySelectorAll('.alt').forEach(btn => {
      btn.addEventListener('click', () => escolher(parseInt(btn.dataset.idx)));
    });
  }
  document.getElementById('btnAvancar').addEventListener('click', () => {
    if (respostas[atual] === null) return;
    atual++;
    renderizarQuestao();
  });
}

function escolher(idx){
  const q = questoes[atual];
  respostasEscolhidas[atual] = idx;
  respostas[atual] = q.alternativas[idx].correta;
  renderizarQuestao();
}

function renderizarResultado(){
  const acertos = respostas.filter(r => r === true).length;
  let html = `
    <div class="resultado">
      <div class="numero-grande">${acertos}/${questoes.length}</div>
      <h2>Revisão concluída</h2>
      <p>Confira abaixo o desempenho por tema e revise os pontos que exigem atenção antes da prova.</p>
      <div class="resumo-lista">
  `;
  questoes.forEach((q, i) => {
    const cor = respostas[i] ? 'certa' : 'errada';
    html += `<div class="resumo-item">
      <div class="marca ${cor}">${i+1}</div>
      <span class="num-mini">Q${q.numero}</span>
      <span class="tema-mini">${q.tema}</span>
    </div>`;
  });
  html += `</div><button class="reiniciar" id="btnReiniciar">Refazer a revisão</button></div>`;
  cartaoEl.innerHTML = html;
  montarTrilha();
  document.getElementById('btnReiniciar').addEventListener('click', () => {
    atual = 0;
    respostas = new Array(questoes.length).fill(null);
    respostasEscolhidas = new Array(questoes.length).fill(null);
    renderizarQuestao();
  });
}

renderizarQuestao();
</script>

</body>
</html>
